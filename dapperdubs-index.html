<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#d4a054">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon192.png">
<title>Dapper Dubs - Grooming Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #1c1917; --sidebar: #1a1613; --card: #292524; --card-hover: #33302c;
    --accent: #d4a054; --accent-light: #e0b872; --green: #6d9e1d; --green-light: #8bc34a;
    --red: #c0392b; --blue: #5b8db8; --purple: #8b6fad;
    --text: #f5f0e8; --text-dim: #a89f91; --text-muted: #7a7168; --border: #3d3730;
    --gold: #d4a054; --gold-light: #e8c88a; --gold-dark: #b08030;
    --espresso: #1c1917; --espresso-light: #292524; --espresso-mid: #44403c;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --p1: #c0392b; --p2: #d4a054; --p3: #5b8db8; --p4: #7a7168;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    overflow-x: hidden;
    padding-top: var(--safe-top);
    padding-bottom: calc(64px + var(--safe-bottom));
  }

  /* ===== MOBILE BOTTOM NAV ===== */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--sidebar); border-top: 1px solid var(--border);
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px 0 calc(6px + var(--safe-bottom));
    z-index: 100;
  }
  .bottom-nav .tab {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 6px 12px; border-radius: 10px; cursor: pointer;
    color: var(--text-muted); font-size: 10px; font-weight: 600;
    transition: all 0.15s; min-width: 48px;
  }
  .bottom-nav .tab .tab-icon { font-size: 20px; }
  .bottom-nav .tab.active { color: var(--gold-light); background: rgba(212,160,84,0.1); }

  /* ===== DESKTOP SIDEBAR ===== */
  .sidebar {
    width: 260px; background: var(--sidebar); border-right: 1px solid var(--border);
    padding: 24px 16px; display: none; flex-direction: column;
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
  }
  @media (min-width: 769px) {
    .sidebar { display: flex; }
    .bottom-nav { display: none; }
    .main { margin-left: 260px; }
  }

  .sidebar-header { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
  .app-icon { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
  .sidebar-header h1 { font-size: 18px; font-weight: 800; color: var(--gold-light); }
  .sidebar-header p { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-radius: 8px; cursor: pointer; transition: all 0.15s;
    font-size: 14px; font-weight: 500; color: var(--text-dim);
  }
  .nav-item:hover { background: var(--card); color: var(--text); }
  .nav-item.active { background: var(--gold-dark); color: white; }
  .nav-item .icon { font-size: 18px; width: 24px; text-align: center; }
  .nav-item .badge { margin-left: auto; background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }

  .sidebar-stats { margin-top: auto; padding: 14px; background: var(--card); border-radius: 12px; }
  .stat-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 13px; }
  .stat-row .label { color: var(--text-dim); }
  .stat-row .value { font-weight: 700; color: var(--gold-light); }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--green)); border-radius: 3px; transition: width 0.5s; }

  /* ===== MAIN ===== */
  .main { padding: 20px 16px 24px; max-width: 700px; margin: 0 auto; }
  @media (min-width: 769px) { .main { padding: 32px 40px; margin: 0; margin-left: 260px; } }

  .main-header { margin-bottom: 24px; }
  .main-header h2 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .main-header .subtitle { font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .streak { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, rgba(212,160,84,0.2), rgba(176,128,48,0.2)); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--gold-light); margin-top: 8px; }

  /* ===== TIME-OF-DAY BANNER ===== */
  .time-banner {
    background: linear-gradient(135deg, var(--card), var(--espresso-mid));
    border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
  }
  .time-banner .time-icon { font-size: 28px; }
  .time-banner .time-greeting { font-size: 16px; font-weight: 700; color: var(--gold-light); }
  .time-banner .time-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  /* ===== NOTIFICATION BANNER ===== */
  .notif-banner {
    background: linear-gradient(135deg, var(--gold-dark), #8b6020);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .notif-banner .icon { font-size: 24px; }
  .notif-banner .text { font-size: 13px; font-weight: 600; }
  .notif-banner .sub { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; }

  /* ===== SECTION ===== */
  .section { margin-bottom: 20px; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 4px; }
  .section-header h3 { font-size: 14px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
  .section-header .count { font-size: 12px; color: var(--text-muted); background: var(--card); padding: 2px 8px; border-radius: 8px; }

  /* ===== QUICK COMPLETE CHAIN ===== */
  .chain-btn {
    background: linear-gradient(135deg, var(--gold-dark), var(--gold));
    color: white; border: none; border-radius: 10px; padding: 10px 16px;
    font-size: 13px; font-weight: 700; cursor: pointer; width: 100%;
    margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.1s;
  }
  .chain-btn:active { transform: scale(0.98); }
  .chain-btn.done { background: var(--green); opacity: 0.7; }

  /* ===== TASK ITEMS ===== */
  .task-item {
    background: var(--card); border-radius: 12px; padding: 14px 16px;
    margin-bottom: 8px; display: flex; align-items: flex-start; gap: 12px;
    cursor: pointer; transition: all 0.15s; border: 1px solid transparent;
  }
  .task-item:hover { background: var(--card-hover); }
  .task-item:active { transform: scale(0.99); }
  .task-item.completed { opacity: 0.5; }
  .task-item.completed .task-name { text-decoration: line-through; }
  .task-item.overdue { border-color: rgba(192,57,43,0.3); }

  .checkbox {
    width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--text-muted);
    flex-shrink: 0; margin-top: 1px; transition: all 0.15s; position: relative;
  }
  .checkbox.p1 { border-color: var(--p1); }
  .checkbox.p2 { border-color: var(--p2); }
  .checkbox.p3 { border-color: var(--p3); }
  .checkbox.p4 { border-color: var(--p4); }
  .checkbox.checked { background: var(--gold); border-color: var(--gold); }
  .checkbox.checked::after { content: ''; position: absolute; top: 4px; left: 7px; width: 5px; height: 9px; border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  .task-content { flex: 1; min-width: 0; }
  .task-name { font-size: 14px; font-weight: 600; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .task-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
  .task-tag.tag-time { background: rgba(91,141,184,0.15); color: var(--blue); }
  .task-tag.tag-recurring { background: rgba(212,160,84,0.15); color: var(--gold-light); }
  .task-tag.tag-overdue { background: rgba(192,57,43,0.15); color: var(--red); }
  .task-tag.tag-p1 { background: rgba(192,57,43,0.15); color: var(--red); }
  .task-tag.tag-p2 { background: rgba(212,160,84,0.15); color: var(--gold); }
  .task-tag.tag-streak { background: rgba(109,158,29,0.15); color: var(--green-light); }
  .task-description { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .task-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .next-due { font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .next-due.today { color: var(--gold-light); }
  .next-due.overdue { color: var(--red); }

  /* ===== ADD TASK ===== */
  .add-task-btn {
    text-align: center; padding: 12px; color: var(--text-muted);
    border: 1px dashed var(--border); border-radius: 12px; cursor: pointer;
    font-size: 13px; font-weight: 600; transition: all 0.15s; margin-top: 8px;
  }
  .add-task-btn:hover { color: var(--gold); border-color: var(--gold); }

  /* ===== STREAK DISPLAY ===== */
  .streak-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 20px; }
  .streak-card {
    background: var(--card); border-radius: 10px; padding: 12px;
    text-align: center; border: 1px solid var(--border);
  }
  .streak-card .streak-icon { font-size: 24px; margin-bottom: 4px; }
  .streak-card .streak-name { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .streak-card .streak-count { font-size: 22px; font-weight: 800; color: var(--gold-light); }
  .streak-card .streak-label { font-size: 10px; color: var(--text-muted); }

  /* ===== CALENDAR VIEW ===== */
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 16px; }
  .cal-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-align: center; padding: 4px; }
  .cal-day {
    aspect-ratio: 1; border-radius: 8px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-size: 12px; font-weight: 600;
    color: var(--text-dim); background: var(--card); cursor: pointer; position: relative;
  }
  .cal-day.today { border: 2px solid var(--gold); color: var(--gold-light); }
  .cal-day.has-tasks::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); position: absolute; bottom: 4px; }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.other-month { opacity: 0.3; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .cal-legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ===== SETTINGS ===== */
  .settings-section { margin-bottom: 24px; }
  .settings-section h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: var(--text-dim); }
  .setting-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--card); border-radius: 10px; margin-bottom: 6px;
  }
  .setting-row .label { font-size: 14px; font-weight: 600; }
  .setting-row .desc { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .toggle {
    width: 44px; height: 24px; border-radius: 12px; background: var(--border);
    cursor: pointer; position: relative; transition: background 0.2s; flex-shrink: 0;
  }
  .toggle::after {
    content: ''; width: 20px; height: 20px; border-radius: 50%; background: white;
    position: absolute; top: 2px; left: 2px; transition: transform 0.2s;
  }
  .toggle.on { background: var(--gold); }
  .toggle.on::after { transform: translateX(20px); }
  .notif-status-card { background: var(--card); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .notif-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .notif-dot.active { background: var(--green); }
  .notif-dot.limited { background: var(--gold); }
  .notif-dot.inactive { background: var(--red); }
  .btn-primary { background: var(--gold); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; width: 100%; margin-top: 8px; }
  .btn-primary:active { opacity: 0.9; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 200; display: flex;
    align-items: flex-end; justify-content: center;
    animation: fadeIn 0.15s;
  }
  @media (min-width: 769px) { .modal-overlay { align-items: center; } }
  .modal {
    background: var(--bg); border-radius: 20px 20px 0 0; padding: 24px 20px 32px;
    width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto;
    animation: slideUp 0.2s;
  }
  @media (min-width: 769px) { .modal { border-radius: 20px; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(50%); } to { transform: translateY(0); } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-header h3 { font-size: 18px; font-weight: 800; }
  .modal-close { width: 32px; height: 32px; border-radius: 50%; background: var(--card); border: none; color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-input, .form-select {
    width: 100%; padding: 10px 12px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit;
  }
  .form-input:focus, .form-select:focus { border-color: var(--gold); outline: none; }
  .form-select option { background: var(--bg); color: var(--text); }
  .form-row { display: flex; gap: 10px; }
  .form-row > * { flex: 1; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--gold-dark); color: white; padding: 10px 20px; border-radius: 10px;
    font-size: 13px; font-weight: 600; z-index: 300; opacity: 0;
    transition: all 0.3s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- SIDEBAR (Desktop) -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="app-icon">DD</div>
    <div>
      <h1>Dapper Dubs</h1>
      <p>A true gentleman's routine</p>
    </div>
  </div>
  <div id="sidebarNav"></div>
  <div class="sidebar-stats" id="sidebarStats"></div>
</div>

<!-- BOTTOM NAV (Mobile) -->
<div class="bottom-nav" id="bottomNav"></div>

<!-- MAIN CONTENT -->
<div class="main" id="app"></div>

<!-- TASK EDITOR MODAL -->
<div id="taskModal"></div>

<script>
// ============================================================
// ===== TASK DATABASE ========================================
// ============================================================

const DEFAULT_TASKS = [
  // Morning Routine
  { id: 'morning-face-wash', name: 'Morning Face Wash', icon: '🧴', type: 'daily', time: '09:00', timeMinutes: 540, priority: 1, recurrence: 'daily', section: 'morning', description: '', reminder: 30 },
  { id: 'morning-moisturize', name: 'Morning Face Moisturize', icon: '💧', type: 'daily', time: '09:05', timeMinutes: 545, priority: 1, recurrence: 'daily', section: 'morning', description: '', reminder: 30 },
  { id: 'morning-teeth', name: 'Morning Teeth Brush + Mouthwash', icon: '🪥', type: 'daily', time: '09:10', timeMinutes: 550, priority: 1, recurrence: 'daily', section: 'morning', description: '', reminder: 30 },
  // Bedtime Routine
  { id: 'contacts-out', name: 'Take Contacts Out', icon: '👁️', type: 'daily', time: '21:00', timeMinutes: 1260, priority: 1, recurrence: 'daily', section: 'bedtime', description: '', reminder: 30 },
  { id: 'evening-face-wash', name: 'Evening Face Wash', icon: '🧴', type: 'daily', time: '22:00', timeMinutes: 1320, priority: 1, recurrence: 'daily', section: 'bedtime', description: '', reminder: 30 },
  { id: 'evening-moisturize', name: 'Evening Face Moisturize', icon: '💧', type: 'daily', time: '22:05', timeMinutes: 1325, priority: 1, recurrence: 'daily', section: 'bedtime', description: '', reminder: 30 },
  { id: 'evening-teeth', name: 'Evening Teeth Brush + Mouthwash', icon: '🪥', type: 'daily', time: '22:10', timeMinutes: 1330, priority: 1, recurrence: 'daily', section: 'bedtime', description: '', reminder: 30 },
  { id: 'evening-shower', name: 'Evening Shower', icon: '🚿', type: 'daily', time: '22:15', timeMinutes: 1335, priority: 1, recurrence: 'daily', section: 'bedtime', description: '', reminder: 30 },
  // Weekly Maintenance
  { id: 'neck-shapeup', name: 'Neck Hair Shape Up', icon: '✂️', type: 'weekly', priority: 1, recurrence: 'weekly', nextDue: '2026-05-11', section: 'weekly', description: '' },
  { id: 'beard-lineup', name: 'Beard Lineup', icon: '🪒', type: 'weekly', priority: 1, recurrence: 'weekly', nextDue: '2026-05-11', section: 'weekly', description: '' },
  { id: 'beard-trim', name: 'Beard Trim + Lineup', icon: '💈', type: 'weekly', priority: 1, recurrence: 'biweekly', nextDue: '2026-05-18', section: 'weekly', description: '' },
  { id: 'fingernails', name: 'Trim Fingernails', icon: '💅', type: 'weekly', priority: 1, recurrence: 'biweekly', nextDue: '2026-05-18', section: 'weekly', description: '' },
  { id: 'manscaping', name: 'Manscaping', icon: '🪒', type: 'weekly', priority: 1, recurrence: 'biweekly', nextDue: '2026-05-18', section: 'weekly', description: '' },
  { id: 'eyebrow-shapeup', name: 'Eyebrow Shape Up', icon: '👁️', type: 'weekly', priority: 1, recurrence: 'custom', repeat_interval_value: 4, repeat_interval_unit: 'week', repeat_basis: 'scheduled', nextDue: '2026-06-01', section: 'weekly', description: '' },
  { id: 'toenails', name: 'Trim Toenails', icon: '🦶', type: 'weekly', priority: 1, recurrence: 'custom', repeat_interval_value: 4, repeat_interval_unit: 'week', repeat_basis: 'scheduled', nextDue: '2026-06-01', section: 'weekly', description: '' },
  { id: 'haircut', name: 'Haircut', icon: '💇', type: 'weekly', priority: 1, recurrence: 'custom', repeat_interval_value: 6, repeat_interval_unit: 'week', repeat_basis: 'scheduled', nextDue: '2026-06-15', section: 'weekly', description: '' },
];

function getTasksDB() {
  try {
    const raw = localStorage.getItem('dd_tasks_v1');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}
function saveTasksDB(tasks) {
  try { localStorage.setItem('dd_tasks_v1', JSON.stringify(tasks)); } catch(e) {}
}
function initTasks() {
  if (!getTasksDB()) saveTasksDB(DEFAULT_TASKS);
}
initTasks();

function getAllTasks() { return getTasksDB() || DEFAULT_TASKS; }
function getDailyTasks() { return getAllTasks().filter(t => t.type === 'daily').sort((a,b) => (a.timeMinutes||0) - (b.timeMinutes||0)); }
function getWeeklyTasks() { return getAllTasks().filter(t => t.type === 'weekly'); }
function getMorningTasks() { return getDailyTasks().filter(t => t.section === 'morning'); }
function getBedtimeTasks() { return getDailyTasks().filter(t => t.section === 'bedtime'); }
function getTask(id) { return getAllTasks().find(t => t.id === id); }
function saveTask(task) {
  const tasks = getAllTasks();
  const i = tasks.findIndex(t => t.id === task.id);
  if (i >= 0) tasks[i] = task; else tasks.push(task);
  saveTasksDB(tasks);
}
function deleteTask(id) {
  saveTasksDB(getAllTasks().filter(t => t.id !== id));
}

function formatTime24to12(t) {
  if (!t) return '';
  const [h,m] = t.split(':').map(Number);
  const suffix = h >= 12 ? 'PM' : 'AM';
  return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${suffix}`;
}

// ===== RECURRENCE ENGINE =====
const RECURRENCE_LABELS = {
  daily: 'Every day', weekly: 'Every week', biweekly: 'Every 2 weeks',
  monthly: 'Every month', custom: 'Custom'
};

function toDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function computeNextDue(task, completionDate) {
  const today = completionDate ? new Date(completionDate) : new Date();
  today.setHours(0,0,0,0);
  if (task.recurrence === 'custom' && task.repeat_interval_value && task.repeat_interval_unit) {
    const val = parseInt(task.repeat_interval_value) || 1;
    const unit = task.repeat_interval_unit;
    const basis = task.repeat_basis || 'scheduled';
    let baseDate;
    if (basis === 'completed') baseDate = new Date(today);
    else baseDate = task.nextDue ? new Date(task.nextDue + 'T12:00:00') : new Date(today);
    let next = new Date(baseDate);
    switch (unit) {
      case 'day': next.setDate(next.getDate() + val); break;
      case 'week': next.setDate(next.getDate() + (val * 7)); break;
      case 'month': next.setMonth(next.getMonth() + val); break;
      case 'year': next.setFullYear(next.getFullYear() + val); break;
    }
    if (task.repeat_end_date) {
      const endDate = new Date(task.repeat_end_date + 'T23:59:59');
      if (next > endDate) return null;
    }
    return toDateStr(next);
  }
  let next = new Date(today);
  switch (task.recurrence) {
    case 'daily': next.setDate(next.getDate() + 1); break;
    case 'weekly': next.setDate(next.getDate() + 7); break;
    case 'biweekly': next.setDate(next.getDate() + 14); break;
    case 'monthly': next.setMonth(next.getMonth() + 1); break;
    default: next.setDate(next.getDate() + 7); break;
  }
  return toDateStr(next);
}

function formatRecurrence(task) {
  if (task.recurrence !== 'custom') return RECURRENCE_LABELS[task.recurrence] || task.recurrence;
  const val = task.repeat_interval_value || 1;
  const unit = task.repeat_interval_unit || 'day';
  const unitLabels = { day: ['day','days'], week: ['week','weeks'], month: ['month','months'], year: ['year','years'] };
  const label = unitLabels[unit] || [unit, unit+'s'];
  const basis = task.repeat_basis === 'completed' ? ' (after completion)' : '';
  if (val == 1) return `Every ${label[0]}${basis}`;
  return `Every ${val} ${label[1]}${basis}`;
}

// ===== HELPERS =====
const getNow = () => new Date();
const getCurrentMinutes = () => { const n=getNow(); return n.getHours()*60+n.getMinutes(); };
const getTodayKey = () => { const d=getNow(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

function formatDate(ds) {
  if (!ds) return '';
  const d=new Date(ds+'T12:00:00'), today=getNow(); today.setHours(12,0,0,0);
  const diff=Math.floor((d-today)/(864e5));
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow';
  if(diff<0) return `${Math.abs(diff)}d overdue`;
  if(diff<7) return d.toLocaleDateString('en-US',{weekday:'long'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
const isOverdue = ds => ds && new Date(ds+'T23:59:59') < getNow();
const isDueToday = ds => ds === getTodayKey();
const getDailyCompleted = () => state.completedToday[getTodayKey()] || [];
const isDailyDone = id => getDailyCompleted().includes(id);
const isWeeklyDone = id => (state.completedWeekly[getTodayKey()] || []).includes(id);

// ===== STREAK TRACKING =====
function updateStreak(taskId) {
  if (!state.streaks[taskId]) state.streaks[taskId] = { count: 0, lastDate: null };
  const s = state.streaks[taskId];
  const today = getTodayKey();
  if (s.lastDate === today) return; // Already counted today
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  const yKey = toDateStr(yesterday);
  if (s.lastDate === yKey || !s.lastDate) {
    s.count++;
  } else {
    s.count = 1; // Streak broken, restart
  }
  s.lastDate = today;
  saveState();
}

function getStreak(taskId) {
  return state.streaks[taskId]?.count || 0;
}

// ===== COMPLETION HANDLERS =====
function toggleDaily(id) {
  const k=getTodayKey(); if(!state.completedToday[k]) state.completedToday[k]=[];
  const a=state.completedToday[k], i=a.indexOf(id);
  if(i>=0) {
    a.splice(i,1);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => {
        if (reg.active) reg.active.postMessage({ type: 'TASK_UNCOMPLETED', taskId: id });
      });
    }
    const log = getNotifLog();
    delete log[`${k}-${id}-cleared`];
    saveNotifLog(log);
  }
  else {
    a.push(id);
    showToast('Looking sharp, king! 👑');
    clearNotificationsForTask(id);
    notifyWorkerTaskComplete(id);
    updateStreak(id);
  }
  saveState(); render();
}

function toggleWeekly(id) {
  const k=getTodayKey(); if(!state.completedWeekly[k]) state.completedWeekly[k]=[];
  const a=state.completedWeekly[k], i=a.indexOf(id);
  if(i>=0) {
    a.splice(i,1);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => {
        if (reg.active) reg.active.postMessage({ type: 'TASK_UNCOMPLETED', taskId: id });
      });
    }
    const log = getNotifLog();
    delete log[`${k}-${id}-cleared`];
    saveNotifLog(log);
  }
  else {
    a.push(id);
    showToast('Maintenance done! Stay dapper 💈');
    clearNotificationsForTask(id);
    notifyWorkerTaskComplete(id);
    updateStreak(id);
    const task = getTask(id);
    if (task && task.recurrence) {
      task.last_completed_date = getTodayKey();
      const nextDue = computeNextDue(task, getTodayKey());
      if (nextDue) task.nextDue = nextDue;
      else task.nextDue = null;
      saveTask(task);
    }
  }
  saveState(); render();
}

// Quick-complete chain — complete all tasks in a section at once
function completeChain(section) {
  const tasks = getDailyTasks().filter(t => t.section === section);
  let count = 0;
  tasks.forEach(t => {
    if (!isDailyDone(t.id)) {
      const k = getTodayKey();
      if (!state.completedToday[k]) state.completedToday[k] = [];
      state.completedToday[k].push(t.id);
      clearNotificationsForTask(t.id);
      notifyWorkerTaskComplete(t.id);
      updateStreak(t.id);
      count++;
    }
  });
  if (count > 0) {
    showToast(`${count} tasks done! Full routine complete 💎`);
    saveState(); render();
  } else {
    showToast('Already completed!');
  }
}

function getStats() {
  const daily = getDailyTasks();
  const weekly = getWeeklyTasks();
  const dd=daily.filter(t=>isDailyDone(t.id)).length, td=daily.length;
  const wdue=weekly.filter(t=>isDueToday(t.nextDue)||isOverdue(t.nextDue)).length;
  const wdone=weekly.filter(t=>(isDueToday(t.nextDue)||isOverdue(t.nextDue))&&isWeeklyDone(t.id)).length;
  const total=td+wdue, done=dd+wdone;
  return { dd, td, wdue, wdone, done, total, pct: total>0?Math.round(done/total*100):0 };
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function subscribeToPush() {

function clearNotificationsForTask(taskId) {
  const log = getNotifLog();
  const todayKey = getTodayKey();
  Object.keys(log).forEach(k => {
    if (k.startsWith(`${todayKey}-${taskId}`)) delete log[k];
  });
  log[`${todayKey}-${taskId}-cleared`] = Date.now();
  saveNotifLog(log);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => {
      if (reg.active) reg.active.postMessage({ type: 'TASK_COMPLETED', taskId });
    });
  }
}

function checkAndNotify() {
  if (!state.notificationsEnabled || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = getCurrentMinutes();
  const nowMs = Date.now();
  const todayKey = getTodayKey();
  const log = getNotifLog();
  Object.keys(log).forEach(k => { if (!k.startsWith(todayKey)) delete log[k]; });

  getDailyTasks().forEach(task => {
    if (!task.timeMinutes) return;
    const isComplete = isDailyDone(task.id);
    const cleared = log[`${todayKey}-${task.id}-cleared`];
    if (isComplete || cleared) return;
    const taskTime = task.timeMinutes;
    const reminderTime = task.reminder ? taskTime - task.reminder : null;

    if (reminderTime !== null && now >= reminderTime && now < taskTime) {
      const rKey = `${todayKey}-${task.id}-pre`;
      if (!log[rKey]) {
        log[rKey] = nowMs;
        showSWNotification(`🔔 Coming up: ${task.name}`, `In ${task.reminder} minutes (${formatTime24to12(task.time)})`, rKey, task.id);
      }
    }
    if (now >= taskTime) {
      const tKey = `${todayKey}-${task.id}-due`;
      if (!log[tKey]) {
        log[tKey] = nowMs;
        showSWNotification(`💈 ${task.name}`, `Time for ${task.name.toLowerCase()}.`, tKey, task.id);
      }
    }
    if (now > taskTime) {
      const minutesPast = now - taskTime;
      const intervals = Math.floor(minutesPast / 30);
      if (intervals > 0) {
        const pKey = `${todayKey}-${task.id}-persist-${intervals}`;
        if (!log[pKey]) {
          log[pKey] = nowMs;
          const hoursPast = Math.floor(minutesPast / 60);
          const minsPast = minutesPast % 60;
          const timeAgo = hoursPast > 0 ? `${hoursPast}h ${minsPast}m` : `${minsPast}m`;
          showSWNotification(`⚠️ Overdue: ${task.name}`, `Was due ${timeAgo} ago. Tap to complete.`, pKey, task.id);
        }
      }
    }
  });

  getWeeklyTasks().forEach(task => {
    if (!isDueToday(task.nextDue) && !isOverdue(task.nextDue)) return;
    if (isWeeklyDone(task.id)) return;
    const cleared = log[`${todayKey}-${task.id}-cleared`];
    if (cleared) return;
    const wKey = `${todayKey}-${task.id}-weekly`;
    if (!log[wKey]) {
      log[wKey] = nowMs;
      showSWNotification(`💈 ${task.name}`, isOverdue(task.nextDue) ? 'This task is overdue!' : 'Due today!', wKey, task.id);
    }
    if (isOverdue(task.nextDue)) {
      const hours = Math.floor((nowMs - (log[wKey] || nowMs)) / (2 * 60 * 60 * 1000));
      if (hours > 0) {
        const wpKey = `${todayKey}-${task.id}-weekly-p${hours}`;
        if (!log[wpKey]) {
          log[wpKey] = nowMs;
          showSWNotification(`⚠️ Still due: ${task.name}`, `Overdue — ${formatDate(task.nextDue)}`, wpKey, task.id);
        }
      }
    }
  });
  saveNotifLog(log);
}

let notifInterval = null;
function scheduleNotificationCheck() {
  if (notifInterval) clearInterval(notifInterval);
  notifInterval = setInterval(checkAndNotify, 30000);
  checkAndNotify();
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'COMPLETE_TASK') {
      const task = getTask(e.data.taskId);
      if (task) {
        if (task.type === 'daily') toggleDaily(task.id);
        else toggleWeekly(task.id);
      }
    }
    if (e.data?.type === 'BG_COMPLETIONS' && e.data.completions?.length) {
      let count = 0;
      for (const c of e.data.completions) {
        const task = getTask(c.taskId);
        if (!task) continue;
        if (task.type === 'daily' && !isDailyDone(c.taskId)) {
          const k = getTodayKey();
          if (!state.completedToday[k]) state.completedToday[k] = [];
          if (!state.completedToday[k].includes(c.taskId)) {
            state.completedToday[k].push(c.taskId);
            clearNotificationsForTask(c.taskId);
            notifyWorkerTaskComplete(c.taskId);
            updateStreak(c.taskId);
            count++;
          }
        } else if (task.type === 'weekly' && !isWeeklyDone(c.taskId)) {
          const k = getTodayKey();
          if (!state.completedWeekly[k]) state.completedWeekly[k] = [];
          if (!state.completedWeekly[k].includes(c.taskId)) {
            state.completedWeekly[k].push(c.taskId);
            clearNotificationsForTask(c.taskId);
            notifyWorkerTaskComplete(c.taskId);
            updateStreak(c.taskId);
            if (task.recurrence) {
              task.last_completed_date = getTodayKey();
              const nextDue = computeNextDue(task, getTodayKey());
              if (nextDue) task.nextDue = nextDue; else task.nextDue = null;
              saveTask(task);
            }
            count++;
          }
        }
      }
      if (count > 0) {
        saveState(); render();
        showToast(`${count} task${count>1?'s':''} completed from notifications`);
      }
    }
  });
  navigator.serviceWorker.ready.then(reg => {
    if (reg.active) reg.active.postMessage({ type: 'GET_BG_COMPLETIONS' });
  });
}

                <option value="day" ${task.repeat_interval_unit==='day'?'selected':''}>Day(s)</option>
                <option value="week" ${task.repeat_interval_unit==='week'?'selected':''}>Week(s)</option>
                <option value="month" ${task.repeat_interval_unit==='month'?'selected':''}>Month(s)</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Basis</label>
            <select class="form-select" id="ed-repeat-basis">
              <option value="scheduled" ${task.repeat_basis!=='completed'?'selected':''}>From scheduled date</option>
              <option value="completed" ${task.repeat_basis==='completed'?'selected':''}>From completion date</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">End date (optional)</label>
            <input class="form-input" type="date" id="ed-repeat-end" value="${task.repeat_end_date||''}">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Next due</label>
          <input class="form-input" id="ed-nextdue" type="date" value="${task.nextDue||getTodayKey()}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <input class="form-input" id="ed-desc" value="${task.description||''}" placeholder="Optional notes">
      </div>
      <button class="btn-primary" onclick="saveTaskFromEditor()" style="margin-top:8px">Save Task</button>
      ${!isNew ? `<button class="btn-primary" onclick="if(confirm('Delete this task?')){deleteTask('${task.id}');closeTaskEditor();render();}" style="margin-top:8px;background:var(--red)">Delete Task</button>` : ''}
    </div>
  </div>`;
}

function closeTaskEditor() {
  state.editingTask = null;
  document.getElementById('taskModal').innerHTML = '';
}

function saveTaskFromEditor() {
  const isNew = state.editingTask === 'new';
  const name = document.getElementById('ed-name').value.trim();
  if (!name) { showToast('Enter a task name'); return; }

  const type = document.getElementById('ed-type').value;
  const icon = document.getElementById('ed-icon').value || '✂️';
  const priority = parseInt(document.getElementById('ed-priority').value);
  const desc = document.getElementById('ed-desc').value.trim();

  let task;
  if (type === 'daily') {
    const time = document.getElementById('ed-time').value;
    const [h,m] = time.split(':').map(Number);
    const section = document.getElementById('ed-section').value;
    const reminder = parseInt(document.getElementById('ed-reminder').value) || 30;
    task = {
      id: isNew ? 'custom-' + Date.now() : state.editingTask,
      name, icon, type: 'daily', time, timeMinutes: h*60+m,
      priority, recurrence: 'daily', section, description: desc, reminder
    };
  } else {
    const recurrence = document.getElementById('ed-recurrence').value;
    const nextDue = document.getElementById('ed-nextdue').value;
    const repeatVal = document.getElementById('ed-repeat-val')?.value;
    const repeatUnit = document.getElementById('ed-repeat-unit')?.value;
    const repeatBasis = document.getElementById('ed-repeat-basis')?.value;
    const repeatEnd = document.getElementById('ed-repeat-end')?.value;
    const existingTask = !isNew ? getTask(state.editingTask) : null;
    task = {
      id: isNew ? 'custom-' + Date.now() : state.editingTask,
      name, icon, type: 'weekly', priority, recurrence, nextDue,
      section: 'weekly', description: desc,
      repeat_interval_value: recurrence === 'custom' ? parseInt(repeatVal) : null,
      repeat_interval_unit: recurrence === 'custom' ? repeatUnit : null,
      repeat_basis: recurrence === 'custom' ? repeatBasis : null,
      repeat_end_date: recurrence === 'custom' && repeatEnd ? repeatEnd : null,
      last_completed_date: existingTask?.last_completed_date || null
    };
  }

  saveTask(task);
  syncTasksToWorker();
  closeTaskEditor();
  render();
  showToast(isNew ? 'Task created!' : 'Task updated!');
}

// ============================================================
// ===== RENDER ===============================================
// ============================================================

function render() {
  const cm = getCurrentMinutes();
  const stats = getStats();
  const isAM = cm < 720; // Before noon
  const isPM = cm >= 1080; // After 6pm

  // Sidebar nav
  document.getElementById('sidebarNav').innerHTML = `
    <div class="nav-item ${state.view==='today'?'active':''}" onclick="setView('today')"><span class="icon">🏠</span>Today<span class="badge">${stats.done}/${stats.total}</span></div>
    <div class="nav-item ${state.view==='morning'?'active':''}" onclick="setView('morning')"><span class="icon">☀️</span>Morning</div>
    <div class="nav-item ${state.view==='bedtime'?'active':''}" onclick="setView('bedtime')"><span class="icon">🌙</span>Bedtime</div>
    <div class="nav-item ${state.view==='weekly'?'active':''}" onclick="setView('weekly')"><span class="icon">📆</span>Maintenance</div>
    <div class="nav-item ${state.view==='streaks'?'active':''}" onclick="setView('streaks')"><span class="icon">🔥</span>Streaks</div>
    <div class="nav-item ${state.view==='calendar'?'active':''}" onclick="setView('calendar')"><span class="icon">📅</span>Calendar</div>
    <div class="nav-item ${state.view==='settings'?'active':''}" onclick="setView('settings')"><span class="icon">⚙️</span>Settings</div>
  `;

  // Sidebar stats
  document.getElementById('sidebarStats').innerHTML = `
    <div class="stat-row"><span class="label">Today</span><span class="value">${stats.done}/${stats.total}</span></div>
    <div class="stat-row"><span class="label">Daily</span><span class="value">${stats.dd}/${stats.td}</span></div>
    <div class="stat-row"><span class="label">Maintenance</span><span class="value">${stats.wdone}/${stats.wdue || 0}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${stats.pct}%"></div></div>
  `;

  // Bottom nav
  document.getElementById('bottomNav').innerHTML = `
    <div class="tab ${state.view==='today'?'active':''}" onclick="setView('today')"><span class="tab-icon">🏠</span>Today</div>
    <div class="tab ${state.view==='morning'||state.view==='bedtime'?'active':''}" onclick="setView(${isAM?"'morning'":"'bedtime'"})"><span class="tab-icon">${isAM?'☀️':'🌙'}</span>${isAM?'AM':'PM'}</div>
    <div class="tab ${state.view==='weekly'?'active':''}" onclick="setView('weekly')"><span class="tab-icon">📆</span>Maint.</div>
    <div class="tab ${state.view==='streaks'?'active':''}" onclick="setView('streaks')"><span class="tab-icon">🔥</span>Streaks</div>
    <div class="tab ${state.view==='settings'?'active':''}" onclick="setView('settings')"><span class="tab-icon">⚙️</span>More</div>
  `;

  // Main content
  const app = document.getElementById('app');
  switch (state.view) {
    case 'today': app.innerHTML = viewToday(cm); break;
    case 'morning': app.innerHTML = viewMorning(cm); break;
    case 'bedtime': app.innerHTML = viewBedtime(cm); break;
    case 'weekly': app.innerHTML = viewWeekly(); break;
    case 'streaks': app.innerHTML = viewStreaks(); break;
    case 'calendar': app.innerHTML = viewCalendar(); break;
    case 'settings': app.innerHTML = viewSettings(); break;
    default: app.innerHTML = viewToday(cm);
  }
}

// ===== TIME-OF-DAY GREETING =====
function getGreeting() {
  const h = getNow().getHours();
  if (h < 12) return { icon: '☀️', greeting: 'Good morning, Chop', sub: 'Time for your morning routine' };
  if (h < 17) return { icon: '🌤️', greeting: 'Good afternoon, Chop', sub: 'How\'s the day going?' };
  if (h < 21) return { icon: '🌅', greeting: 'Good evening, Chop', sub: 'Evening routine time' };
  return { icon: '🌙', greeting: 'Night, Chop', sub: 'Bedtime routine before you crash' };
}

// ===== VIEWS =====
function viewToday(cm) {
  const stats = getStats();
  const g = getGreeting();
  const morning = getMorningTasks();
  const bedtime = getBedtimeTasks();
  const weekly = getWeeklyTasks().filter(t => isDueToday(t.nextDue) || isOverdue(t.nextDue));
  const morningDone = morning.every(t => isDailyDone(t.id));
  const bedtimeDone = bedtime.every(t => isDailyDone(t.id));

  const notifBanner = (!state.notificationsEnabled && 'Notification' in window) ?
    `<div class="notif-banner" onclick="requestNotifPermission()"><span class="icon">🔔</span><div><div class="text">Enable Notifications</div><div class="sub">Get reminders for your routines</div></div></div>` : '';

  return `
  <div class="time-banner"><span class="time-icon">${g.icon}</span><div><div class="time-greeting">${g.greeting}</div><div class="time-sub">${g.sub}</div></div></div>
  ${notifBanner}
  <div class="main-header"><h2>💈 Today's Routine</h2>
    <div class="subtitle">${stats.done}/${stats.total} tasks complete</div>
    ${stats.pct >= 100 ? '<div class="streak">🏆 All done! Looking dapper today.</div>' : stats.pct >= 50 ? '<div class="streak">🔥 Halfway there — keep it up!</div>' : ''}
  </div>

  <div class="section">
    <div class="section-header"><h3>☀️ Morning Routine</h3><span class="count">${morning.filter(t=>isDailyDone(t.id)).length}/${morning.length}</span></div>
    ${!morningDone ? `<button class="chain-btn" onclick="completeChain('morning')">⚡ Complete entire morning routine</button>` : `<button class="chain-btn done">✓ Morning routine complete</button>`}
    ${morning.map(t=>dailyItem(t,cm)).join('')}
  </div>

  <div class="section">
    <div class="section-header"><h3>🌙 Bedtime Routine</h3><span class="count">${bedtime.filter(t=>isDailyDone(t.id)).length}/${bedtime.length}</span></div>
    ${!bedtimeDone ? `<button class="chain-btn" onclick="completeChain('bedtime')">⚡ Complete entire bedtime routine</button>` : `<button class="chain-btn done">✓ Bedtime routine complete</button>`}
    ${bedtime.map(t=>dailyItem(t,cm)).join('')}
  </div>

  ${weekly.length ? `<div class="section"><div class="section-header"><h3>📆 Maintenance Due</h3><span class="count">${weekly.length}</span></div>${weekly.map(weeklyItem).join('')}</div>` : ''}`;
}

function viewMorning(cm) {
  const tasks = getMorningTasks();
  const done = tasks.every(t => isDailyDone(t.id));
  return `<div class="main-header"><h2>☀️ Morning Routine</h2><div class="subtitle">Start your day right — tap to complete</div></div>
  <div class="section">
    ${!done ? `<button class="chain-btn" onclick="completeChain('morning')">⚡ Complete entire morning routine</button>` : `<button class="chain-btn done">✓ All done! Looking fresh.</button>`}
    ${tasks.map(t=>dailyItem(t,cm)).join('')}
    <div class="add-task-btn" onclick="openTaskEditor('new')">+ Add Morning Task</div>
  </div>`;
}

function viewBedtime(cm) {
  const tasks = getBedtimeTasks();
  const done = tasks.every(t => isDailyDone(t.id));
  return `<div class="main-header"><h2>🌙 Bedtime Routine</h2><div class="subtitle">Wind down properly — tap to complete</div></div>
  <div class="section">
    ${!done ? `<button class="chain-btn" onclick="completeChain('bedtime')">⚡ Complete entire bedtime routine</button>` : `<button class="chain-btn done">✓ All done! Sleep well, king.</button>`}
    ${tasks.map(t=>dailyItem(t,cm)).join('')}
    <div class="add-task-btn" onclick="openTaskEditor('new')">+ Add Bedtime Task</div>
  </div>`;
}

function viewWeekly() {
  const weekly = getWeeklyTasks().sort((a,b) => {
    if (!a.nextDue) return 1; if (!b.nextDue) return -1;
    return new Date(a.nextDue) - new Date(b.nextDue);
  });
  return `<div class="main-header"><h2>📆 Weekly Maintenance</h2><div class="subtitle">Grooming, trimming & upkeep — tap to complete</div></div>
  <div class="section">
    ${weekly.map(weeklyItem).join('')}
    <div class="add-task-btn" onclick="openTaskEditor('new')">+ Add Maintenance Task</div>
  </div>`;
}

function viewStreaks() {
  const daily = getDailyTasks();
  const weekly = getWeeklyTasks();
  const allTasks = [...daily, ...weekly];

  return `<div class="main-header"><h2>🔥 Streaks</h2><div class="subtitle">Consistency is key to looking sharp</div></div>
  <div class="streak-grid">
    ${allTasks.map(t => {
      const s = getStreak(t.id);
      return `<div class="streak-card">
        <div class="streak-icon">${t.icon}</div>
        <div class="streak-name">${t.name}</div>
        <div class="streak-count">${s}</div>
        <div class="streak-label">${s === 1 ? 'day' : 'days'} in a row</div>
      </div>`;
    }).join('')}
  </div>`;
}

function viewCalendar() {
  const now = getNow();
  const year = now.getFullYear(), month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayDate = now.getDate();
  const weekly = getWeeklyTasks();

  const monthName = new Date(year, month).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let calDays = '';
  // Empty cells for days before month starts
  for (let i = 0; i < firstDay; i++) calDays += '<div class="cal-day empty"></div>';

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasTasks = weekly.some(t => t.nextDue === dateStr);
    const isToday = d === todayDate;
    const taskNames = weekly.filter(t => t.nextDue === dateStr).map(t => t.icon + ' ' + t.name).join('\n');
    calDays += `<div class="cal-day ${isToday?'today':''} ${hasTasks?'has-tasks':''}" title="${taskNames}">${d}</div>`;
  }

  return `<div class="main-header"><h2>📅 ${monthName}</h2><div class="subtitle">Maintenance calendar — dots show due tasks</div></div>
  <div class="cal-grid">
    <div class="cal-header">Sun</div><div class="cal-header">Mon</div><div class="cal-header">Tue</div>
    <div class="cal-header">Wed</div><div class="cal-header">Thu</div><div class="cal-header">Fri</div><div class="cal-header">Sat</div>
    ${calDays}
  </div>
  <div class="section" style="margin-top:20px">
    <div class="section-header"><h3>📋 This Month</h3></div>
    ${weekly.filter(t => t.nextDue && t.nextDue.startsWith(`${year}-${String(month+1).padStart(2,'0')}`))
      .sort((a,b) => a.nextDue.localeCompare(b.nextDue))
      .map(t => `<div class="task-item" style="cursor:default"><div style="font-size:16px">${t.icon}</div><div class="task-content"><div class="task-name">${t.name}</div><div class="task-meta"><span class="task-tag tag-recurring">🔄 ${formatRecurrence(t)}</span></div></div><div class="next-due ${isDueToday(t.nextDue)?'today':''} ${isOverdue(t.nextDue)?'overdue':''}">${formatDate(t.nextDue)}</div></div>`).join('')}
  </div>`;
}

function viewSettings() {
  const notifOn = state.notificationsEnabled && 'Notification' in window && Notification.permission==='granted';
  const notifSupported = 'Notification' in window;
  const isiOS = isIOS();
  const isPwa = isPWA();

  let notifStatusHTML = '';
  if (isiOS && !isPwa) {
    notifStatusHTML = `<div class="notif-status-card"><div style="font-size:13px;font-weight:600;margin-bottom:6px"><span class="notif-dot inactive"></span>Not Available</div><div style="font-size:12px;color:var(--text-dim)">iOS requires this app to be <strong>added to your Home Screen</strong> first.</div></div>`;
  } else if (notifOn) {
    notifStatusHTML = `<div class="notif-status-card"><div style="font-size:13px;font-weight:600;margin-bottom:6px"><span class="notif-dot active"></span>Active</div><div style="font-size:12px;color:var(--text-dim)">Reminders before tasks, at task time, and every 30 min for overdue tasks.</div></div>`;
  }

  return `<div class="main-header"><h2>⚙️ Settings</h2><div class="subtitle">Notifications & preferences</div></div>

  <div class="settings-section"><h3>🔔 Notifications</h3>
    ${notifStatusHTML}
    <div class="setting-row">
      <div><div class="label">Task reminders</div><div class="desc">30 min before, at time, then every 30 min if overdue</div></div>
      ${notifSupported?`<div class="toggle ${notifOn?'on':''}" onclick="requestNotifPermission()"></div>`:'<span style="font-size:12px;color:var(--text-muted)">Not supported</span>'}
    </div>
    <div class="setting-row">
      <div><div class="label">Background push</div><div class="desc">Server-sent notifications even when app is closed.</div></div>
      ${notifOn && 'PushManager' in window ? `<button style="background:${localStorage.getItem('dd_push_active')==='true'?'var(--green)':'var(--gold)'};color:white;border:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer" onclick="${localStorage.getItem('dd_push_active')==='true' ? "unsubscribeFromPush().then(()=>{showToast('Push disabled');render()})" : "subscribeToPush().then(s=>{if(s)showToast('Push enabled!');render()})"}">${localStorage.getItem('dd_push_active')==='true'?'Enabled':'Enable Push'}</button>` : '<span style="font-size:12px;color:var(--text-muted)">Enable notifications first</span>'}
    </div>
  </div>

  <div class="settings-section"><h3>📱 Install as App</h3>
    <div class="setting-row">
      <div><div class="label">Add to Home Screen</div><div class="desc">iOS: Share > Add to Home Screen<br>Android: Menu > Install app</div></div>
      <span style="font-size:18px">📲</span>
    </div>
  </div>

  <div class="settings-section"><h3>🗑️ Data</h3>
    <div class="setting-row">
      <div><div class="label">Reset all tasks</div><div class="desc">Restore original task list</div></div>
      <button style="background:var(--red);color:white;border:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer" onclick="if(confirm('Reset all tasks to defaults?')){localStorage.removeItem('dd_tasks_v1');initTasks();showToast('Tasks reset');render();}">Reset</button>
    </div>
    <div class="setting-row">
      <div><div class="label">Clear streaks</div><div class="desc">Reset all streak counters to 0</div></div>
      <button style="background:var(--red);color:white;border:none;padding:6px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer" onclick="if(confirm('Clear all streaks?')){state.streaks={};saveState();showToast('Streaks cleared');render();}">Clear</button>
    </div>
  </div>

  <div class="settings-section"><h3>💈 About</h3>
    <div class="setting-row"><div><div class="label">Dapper Dubs v1</div><div class="desc">A true gentleman's routine. Push notifications via Cloudflare Workers. Custom recurrence engine. Streak tracking.</div></div></div>
  </div>`;
}

// ===== TASK ITEM RENDERERS =====
function dailyItem(t, cm) {
  const done=isDailyDone(t.id), past=(t.timeMinutes||0)<=cm;
  const streak = getStreak(t.id);
  const timeDisplay = formatTime24to12(t.time) || '';
  return `<div class="task-item ${done?'completed':''} ${!done&&past?'overdue':''}" onclick="event.stopPropagation();toggleDaily('${t.id}')">
    <div class="checkbox p${t.priority} ${done?'checked':''}"></div>
    <div style="font-size:16px">${t.icon}</div>
    <div class="task-content"><div class="task-name">${t.name}</div><div class="task-meta">
      ${timeDisplay?`<span class="task-tag tag-time">🕐 ${timeDisplay}</span>`:''}
      ${streak >= 3 ? `<span class="task-tag tag-streak">🔥 ${streak}d</span>` : ''}
      ${!done&&past?'<span class="task-tag tag-overdue">⚠️ Past due</span>':''}
    </div></div>
    <div class="task-right">
      <span class="next-due ${!done&&past?'overdue':''}">${timeDisplay}</span>
      <span style="font-size:16px;cursor:pointer;opacity:0.5" onclick="event.stopPropagation();openTaskEditor('${t.id}')">✏️</span>
    </div>
  </div>`;
}

function weeklyItem(t) {
  const done=isWeeklyDone(t.id), od=isOverdue(t.nextDue)&&!done, dt=isDueToday(t.nextDue);
  const streak = getStreak(t.id);
  return `<div class="task-item ${done?'completed':''} ${od?'overdue':''}" onclick="event.stopPropagation();toggleWeekly('${t.id}')">
    <div class="checkbox p${t.priority} ${done?'checked':''}"></div>
    <div style="font-size:16px">${t.icon}</div>
    <div class="task-content"><div class="task-name">${t.name}</div><div class="task-meta">
      <span class="task-tag tag-recurring">🔄 ${formatRecurrence(t)}</span>
      ${streak >= 2 ? `<span class="task-tag tag-streak">🔥 ${streak}x</span>` : ''}
      ${od?'<span class="task-tag tag-overdue">⚠️ Overdue</span>':''}
    </div></div>
    <div class="task-right">
      <span class="next-due ${dt?'today':''} ${od?'overdue':''}">${formatDate(t.nextDue)}</span>
      <span style="font-size:16px;cursor:pointer;opacity:0.5" onclick="event.stopPropagation();openTaskEditor('${t.id}')">✏️</span>
    </div>
  </div>`;
}

// ===== SERVICE WORKER REGISTRATION =====
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'activated') {
          showToast('App updated! Refresh for latest version.');
        }
      });
    });
  });
}

// ===== INIT =====
render();
setInterval(render, 60000);
scheduleNotificationCheck();
</script>
</body>
</html>
